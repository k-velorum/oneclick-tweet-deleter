<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投稿削除ボタンの動作確認</title>
<link rel="stylesheet" href="/content.css">
<style>
body{margin:0;background:#000;color:#e7e9ea;font:16px/1.6 system-ui,sans-serif}main{max-width:600px;margin:60px auto;padding:24px}h1{font-size:22px}p{color:#8b98a5}article{border:1px solid #2f3336;padding:20px;margin:16px 0;border-radius:16px}.header{display:flex;align-items:center;justify-content:space-between}.actions{display:flex;align-items:center}a{color:inherit;text-decoration:none}time{color:#71767b;font-size:13px}button{cursor:pointer;color:inherit;background:transparent;border:0;font:inherit}dialog{border:1px solid #536471;background:#000;color:#e7e9ea;border-radius:18px;padding:28px;width:310px}dialog::backdrop{background:#5b708366}dialog h1{font-size:21px}dialog button{display:block;width:100%;border:1px solid #536471;border-radius:30px;margin-top:12px;padding:10px;font-weight:700}dialog button[data-testid="confirmationSheetConfirm"]{background:#f4212e;border:0}[role=menu]{position:fixed;top:160px;left:50%;background:#202327;padding:18px;border-radius:12px}#result{color:#1d9bf0}
</style>
<main><h1>投稿削除ボタンの動作確認</h1><p>ローカルの模擬投稿です。Xの投稿には影響しません。</p><a data-testid="AppTabBar_Profile_Link" href="/demo">@demo のプロフィール</a>
<article data-testid="tweet"><div class="header"><div data-testid="User-Name"><strong>Demo</strong> @demo<br><a href="/demo/status/123"><time>2026年9月6日</time></a></div><div class="actions"><button data-testid="caret" aria-label="もっと見る">•••</button></div></div><div>確認ボタンのテスト用投稿。通常クリックはY/N、Shift＋クリックは確認を省略します。</div></article>
<article data-testid="tweet"><div class="header"><div data-testid="User-Name"><strong>Other</strong> @other<br><a href="/other/status/456"><time>2026年9月6日</time></a></div><div class="actions"><button data-testid="caret" aria-label="もっと見る">•••</button></div></div><div>他人の投稿には削除ボタンが表示されません。</div></article>
<p id="result" role="status">模擬削除回数：0</p></main>
<script>
let count=0;
document.querySelector('[data-testid="caret"]').onclick=()=>{
 const menu=document.createElement('div');menu.setAttribute('role','menu');menu.innerHTML='<button role="menuitem">削除</button>';
 menu.firstChild.onclick=()=>{menu.remove();const sheet=document.createElement('dialog');sheet.dataset.testid='confirmationSheetDialog';sheet.setAttribute('role','alertdialog');sheet.innerHTML='<h1>ポストを削除しますか？</h1><p>この操作は取り消せません。</p><button data-testid="confirmationSheetConfirm">削除</button><button data-testid="confirmationSheetCancel">キャンセル</button>';sheet.querySelector('[data-testid="confirmationSheetConfirm"]').onclick=()=>{count++;document.querySelector('#result').textContent='模擬削除回数：'+count;sheet.remove();};sheet.querySelector('[data-testid="confirmationSheetCancel"]').onclick=()=>sheet.remove();sheet.oncancel=e=>{e.preventDefault();sheet.remove();};document.body.append(sheet);sheet.showModal();};document.body.append(menu);
};
</script>
<script src="/content.js"></script>
</html>
